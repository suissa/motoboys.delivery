name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Canonical issue tests
        run: node --test-concurrency=1 --import tsx --test tests/issues/*.test.ts
      - name: Existing unit and BDD suites
        run: npm test
      - name: Operational simulation pipeline
        run: npm run simulate:pipeline
