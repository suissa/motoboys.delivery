name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
      - name: Canonical issue tests
        run: node --test-concurrency=1 --import tsx tests/issues
      - name: Existing unit and BDD suites
        run: npm test
      - name: Operational simulation pipeline
        run: npm run simulate:pipeline
